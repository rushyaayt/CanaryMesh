[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canarymesh"
version = "0.1.0"
description = "Automated Cyber Deception and Network Monitoring Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
    "redis>=5.0.0",
]

[project.scripts]
canarymesh = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*"]
