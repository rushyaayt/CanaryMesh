version: "3.8"

services:
  canarymesh:
    build: .
    container_name: canarymesh
    ports:
      - "8000:8000"
    environment:
      - CANARY_HOST=0.0.0.0
      - CANARY_PORT=8000
      - CANARY_PUBLIC_URL=http://localhost:8000
      - CANARY_SECRET_KEY=change-this-production-secret-key-in-deployment
      - CANARY_DATABASE_PATH=/app/data/canarymesh.db
      - CANARY_DEFAULT_WEBHOOK_URL=${CANARY_DEFAULT_WEBHOOK_URL:-}
      - CANARY_ADMIN_API_KEY=${CANARY_ADMIN_API_KEY:-}
      - CANARY_PREVIOUS_ADMIN_API_KEY=${CANARY_PREVIOUS_ADMIN_API_KEY:-}
      - CANARY_READONLY_API_KEY=${CANARY_READONLY_API_KEY:-}
      - CANARY_AWS_WEBHOOK_SECRET=${CANARY_AWS_WEBHOOK_SECRET:-}
      - CANARY_AWS_ACCOUNT_ID=${CANARY_AWS_ACCOUNT_ID:-}
      - CANARY_AWS_PRINCIPAL_ARN=${CANARY_AWS_PRINCIPAL_ARN:-}
      - CANARY_WEBHOOK_ALLOWED_HOSTS=${CANARY_WEBHOOK_ALLOWED_HOSTS:-}
      - CANARY_REDIS_URL=${CANARY_REDIS_URL:-}
      - CANARY_RETENTION_DAYS=${CANARY_RETENTION_DAYS:-0}
      - CANARY_WEBHOOK_RATE_LIMIT=${CANARY_WEBHOOK_RATE_LIMIT:-60}
      - CANARY_WEBHOOK_RATE_WINDOW_SECONDS=${CANARY_WEBHOOK_RATE_WINDOW_SECONDS:-60}
      - CANARY_WEBHOOK_MAX_BODY_BYTES=${CANARY_WEBHOOK_MAX_BODY_BYTES:-65536}
      - CANARY_GEOIP_ENABLED=true
      - CANARY_TRUST_PROXY_HEADERS=false
    volumes:
      - canary_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  canary_data:
    driver: local
